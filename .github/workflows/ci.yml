name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

# A frontend deploy is a tag move on a registry, so two merges landing close
# together can publish out of order and leave `latest` pointing at the older
# bundle. Serialise per ref rather than trying to detect it after the fact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # This repository is public. A ticket id in a source file leaks the
      # title and shape of unreleased work, and an outside reader cannot open
      # the tracker anyway. Ticket ids belong in the commit message and PR
      # title, not the tree - see CLAUDE.md.
      - name: No ticket ids or tracker links in source
        run: ./scripts/check-no-ticket-refs.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # A committed Cargo.lock that does not carry the pinned revision means
      # someone ran `scripts/commons.sh link` and committed the result. That
      # silently un-pins commons for everyone and it looks like nothing.
      - name: Commons pin matches the lock file
        run: |
          REV="$(grep -m1 -oP 'rev = "\K[0-9a-f]{40}' Cargo.toml)"
          if [ -z "$REV" ]; then
            echo "::error::no payserver-commons rev pinned in Cargo.toml"
            exit 1
          fi
          # Per crate, and the crate name has to be in the match. Grepping only
          # for the revision proves that SOME entry is pinned, which a partial
          # un-pin passes: `types` pinned, `ui-kit` left as a path entry, green.
          for CRATE in api-types scrub types ui-kit; do
            if ! awk -v c="$CRATE" -v r="$REV" '
                 /^\[\[package\]\]/ { name=""; src="" }
                 /^name = / { gsub(/[",]/,""); name=$3 }
                 /^source = / { src=$0 }
                 name == c && src ~ r { found=1 }
                 END { exit !found }' Cargo.lock; then
              echo "::error::Cargo.lock does not pin $CRATE at $REV."
              echo "Run 'scripts/commons.sh unlink' and commit the regenerated Cargo.lock."
              exit 1
            fi
          done
          echo "commons pinned at $REV in both Cargo.toml and Cargo.lock"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # A renamed class whose rule stayed behind renders with no styling, and
      # nothing else here notices: the layout suite asserts geometry rather than
      # colour, and e2e locates elements by class, which still match - unstyled.
      # That shipped once, stripping 104 buttons of their styling on testnet.
      - name: Every class in the markup has a rule
        run: python3 scripts/check-classes-styled.py

      # The bundle is what ships, and it is the only configuration where
      # `web-sys` is not a stub. A crate that lints clean on the host can still
      # fail to build for the browser.
      - name: Check wasm32 target
        run: cargo check --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets

  wasm-test:
    name: Wasm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The six `Reflect::set` calls that assemble the wallet-connect
      # transaction object need a real JS object graph, which the host `Test`
      # job above can't give them - they're the one part of the send path
      # nothing here executes otherwise. `scripts/wasm-test.sh` is the single
      # source for both the install steps and the test command, so a local
      # run can't drift from what CI does.
      - name: Wasm-bindgen-test
        run: ./scripts/wasm-test.sh

  layout:
    name: Layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # styles.css layers two design systems across 5000+ lines, so it holds
      # pairs of rules with identical specificity where the later one wins by
      # source order alone. That has produced three user-visible bugs, none of
      # which could fail a normal test: the app compiles, renders, and is simply
      # wrong. These inject the stylesheet into a blank page and assert computed
      # style - no server, no auth, milliseconds.
      #
      # They ran in ethpayserver's E2E suite until the split. They belong here:
      # a CSS regression should fail the repository that owns the CSS.
      - name: Layout regressions
        run: npx playwright test

  build:
    name: Build bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build
        run: trunk build --release

      # The image is built from dist/, so this checks what is actually served
      # rather than what the repository holds.
      - name: Favicon and title are in the bundle
        run: |
          for f in favicon.svg favicon.png favicon.ico; do
            test -s "dist/$f" || { echo "::error::dist/$f missing"; exit 1; }
          done
          grep -q '<title>Random Cash</title>' dist/index.html

      # The whole reason this crate hand-writes its secret scrubber instead of
      # using `regex` is bundle size (~1 MB of WASM). Print it on every build so
      # a regression is visible in the log rather than six months later.
      - name: Bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lhS dist/ | awk 'NR>1 {printf "%-40s %s\n", $9, $5}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish image
    needs: [lint, test, wasm-test, layout, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the job proves its identity with a GitHub OIDC token
      # instead of a long-lived private key. Nothing to store, rotate or leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Tags
        id: tag
        run: |
          # Same shape as the payserver images (`sha-` + 7 chars, matching
          # `git rev-parse --short`), so a tag pinned in a payserver's deploy
          # reads the same as the ones next to it. The moving tag is a
          # convenience; nothing should deploy from it.
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        # Pinned to a commit, not a tag. There is no floating `v4` tag - only
        # exact versions - and beyond that, an action that performs signing is
        # the last place to accept a mutable reference: whoever can move the tag
        # can change what signs our images.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is the one a payserver deployment pins. `latest` is a
      # convenience and nothing should deploy from it.
      - name: Build & push
        run: |
          docker build -f docker/Dockerfile \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }} .
          docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}

          # Signed by DIGEST, never by tag. A tag is a moving pointer: signing
          # `:latest` says "something called that was signed once", which is not
          # a statement about the bytes anyone pulls. The digest is the bytes.
          # `cosign verify` on a tag resolves it to a digest and checks that, so
          # verifying by tag still works for humans.
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }})"
          [ -n "$DIGEST" ] || { echo "::error::no digest for the client image"; exit 1; }
          cosign sign --yes "$DIGEST"
          echo "pushed and signed $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # The frontend deploys on its own cadence now. It used to ride
      # along with whatever ethpayserver release happened next, which meant a
      # frontend fix could not ship without deploying the backend.
      #
      # Only `main` deploys to testnet. A release tag is deliberately NOT wired
      # to production here: promoting to production stays a deliberate act, run
      # by hand against central-infrastructure.
      - name: Deploy to testnet
        if: github.ref == 'refs/heads/main'
        env:
          # Same secret name ethpayserver uses to dispatch its own deploy.
          # central-infrastructure is private, so GITHUB_TOKEN cannot reach it.
          RCS_DISPATCH_PAT: ${{ secrets.RCS_DISPATCH_PAT }}
        run: |
          set -e
          if [ -z "$RCS_DISPATCH_PAT" ]; then
            echo "::error::RCS_DISPATCH_PAT is not set on this repository, so the image was"
            echo "published but nothing was deployed. Add a PAT with repo scope on"
            echo "randomcash/central-infrastructure:"
            echo "  gh secret set RCS_DISPATCH_PAT --repo randomcash/payserver-client"
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RCS_DISPATCH_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d '{"event_type":"deploy-client","client_payload":{"environment":"testnet","sha_tag":"${{ steps.tag.outputs.sha_tag }}"}}'
          echo "dispatched deploy-client testnet ${{ steps.tag.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
