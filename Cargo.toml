# payserver-client is its own workspace root: it has no `path` dependency on any
# payserver. Everything it shares arrives through payserver-commons, pinned by
# revision below, which is what lets one frontend serve EVM, Tron, Solana and
# whatever comes next without any of them being able to reach back in here.
[workspace]
members = ["."]
resolver = "3"

# The one place payserver-commons is pinned. `rev`, not a branch: a lock file
# with no recorded commons revision means "whatever main happened to be that
# minute", and rebuilding last week's commit silently picks up this week's
# commons. To work against a local checkout run `scripts/commons.sh link`,
# which writes an uncommitted `.cargo/config.toml` patch — do not edit this.
[workspace.dependencies]
api-types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "6a88ef12e045dc28b7651fdbd410ca3b9f046dcf" }
scrub = { git = "https://github.com/randomcash/payserver-commons.git", rev = "6a88ef12e045dc28b7651fdbd410ca3b9f046dcf" }
types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "6a88ef12e045dc28b7651fdbd410ca3b9f046dcf" }
ui-kit = { git = "https://github.com/randomcash/payserver-commons.git", rev = "6a88ef12e045dc28b7651fdbd410ca3b9f046dcf" }
# The plugin page vocabulary. Taken from the crate that defines it rather
# than redeclared here: a plugin page is a contract between a plugin this
# client has never heard of and this renderer, and a renamed variant should
# be a build failure rather than a blank panel.
payserver-plugin-api = { git = "https://github.com/randomcash/payserver-commons.git", rev = "6a88ef12e045dc28b7651fdbd410ca3b9f046dcf" }

[package]
name = "payserver-client"
version = "0.1.0"
edition = "2024"
description = "Web frontend for the random.cash payservers"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "payserver-client"
path = "src/main.rs"

[dependencies]
# Shared UI components
ui-kit = { workspace = true, features = ["auth"] }
# `clock`/`wasmbind` for `Utc::now()` in the browser; nothing else. Default
# features pull more into a bundle this workspace deliberately keeps small.
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind"] }
api-types = { workspace = true }
payserver-plugin-api = { workspace = true }
types = { workspace = true }
# Secret/PII redaction, shared with the payservers. Zero dependencies and
# hand-written scanners rather than regexes: `regex` costs ~1 MB of WASM.
scrub = { workspace = true }

# Leptos framework
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"

# WASM interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Navigator",
    "Clipboard",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "console",
    "WebSocket",
    "MessageEvent",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "EventTarget",
    "PromiseRejectionEvent",
    "CustomEvent",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
gloo-net = "0.6"
gloo-timers = "0.3"

# Utilities
thiserror = "2.0"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

# WASM-specific: enable JS random source
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.0", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# `ssr` only: rendering an `AnyView` to a string panics at runtime without it
# (checked in `tachys::view::any_view`, not gated at compile time). Used
# solely by host-target unit tests to assert on rendered markup; the wasm
# binary never sees this feature, since `cargo build`/trunk don't pull in
# dev-dependencies.
leptos = { version = "0.7", default-features = false, features = ["ssr"] }

[features]
default = ["standalone"]
standalone = []

# Size-optimize the WASM bundle; `wasm-opt -Oz` runs on top of this via the
# trunk `data-wasm-opt="z"` flag in index.html. Carried over unchanged from the
# ethpayserver workspace — deliberately just `opt-level`. `panic = "abort"`
# would be the obvious next knob and is the one to leave alone: the panic hook
# in `src/telemetry` is what turns a browser panic into an error report.
[profile.release]
opt-level = "z"
